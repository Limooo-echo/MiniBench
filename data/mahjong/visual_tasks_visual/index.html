<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>MiniBench Mahjong Visual Tasks</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101818; color: #f4f0e4; font-family: Arial, sans-serif; }
    header { padding: 18px 22px; display: flex; align-items: center; gap: 20px; background: #172323; border-bottom: 1px solid #33413e; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 18px; letter-spacing: 0; }
    .header-copy { display: grid; gap: 5px; }
    .subtitle, .task-status { color: #a9bbb0; font-size: 13px; }
    .task-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    label { color: #d5ddca; font-size: 13px; }
    select { min-width: 330px; padding: 9px 34px 9px 10px; border: 1px solid #60716d; border-radius: 4px; background: #f6f1e4; color: #16211f; font: inherit; }
    button { padding: 9px 13px; border: 1px solid #769c82; border-radius: 4px; background: #2e7654; color: #f7f1df; font: inherit; cursor: pointer; }
    button:hover { background: #3b8b63; }
    button.secondary { border-color: #60716d; background: transparent; color: #d5ddca; }
    button.secondary:hover { background: #253b37; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    main { padding: 20px; }
    .progress-panel { width: min(100%, 1280px); margin: 0 auto 16px; padding: 16px 18px; border: 1px solid #334b43; border-radius: 8px; background: #172923; }
    .progress-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h2 { font-size: 16px; }
    .overall-progress { color: #b9e1bd; font-size: 14px; font-variant-numeric: tabular-nums; }
    .progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 18px; }
    .progress-card { min-width: 0; }
    .progress-card-header { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; color: #d5ddca; font-size: 13px; }
    .progress-card-header strong { color: #f7f1df; font-variant-numeric: tabular-nums; }
    .progress-track { height: 9px; overflow: hidden; border-radius: 99px; background: #0d1d1b; }
    .progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #5dbb7a, #b9e1bd); transition: width .25s ease; }
    .task-toolbar { width: min(100%, 1280px); margin: 0 auto 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .task-position { color: #d5ddca; font-size: 14px; font-variant-numeric: tabular-nums; }
    img { display: block; width: min(100%, 1280px); height: auto; margin: 0 auto; border: 1px solid #40534e; border-radius: 6px; background: #174f3c; }
    @media (max-width: 760px) { header { align-items: stretch; flex-direction: column; } .task-controls { margin-left: 0; flex-wrap: wrap; } select { flex: 1 1 100%; min-width: 0; } }
    @media (max-width: 680px) { main { padding: 10px; } .task-toolbar { align-items: stretch; flex-direction: column; } .progress-panel { padding: 14px; } }
  </style>

<article class="progress-card" data-goal="winning_tiles">

  <script>
    const tasks = [{"id": "mj-visual-v10-ukeire-001", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-001.png"}, {"id": "mj-visual-v10-ukeire-002", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-002.png"}, {"id": "mj-visual-v10-ukeire-003", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-003.png"}, {"id": "mj-visual-v10-ukeire-004", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-004.png"}, {"id": "mj-visual-v10-ukeire-005", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-005.png"}, {"id": "mj-visual-v10-ukeire-006", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-006.png"}, {"id": "mj-visual-v10-ukeire-007", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-007.png"}, {"id": "mj-visual-v10-ukeire-008", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-008.png"}, {"id": "mj-visual-v10-ukeire-009", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-009.png"}, {"id": "mj-visual-v10-ukeire-010", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-010.png"}, {"id": "mj-visual-v10-ukeire-011", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-011.png"}, {"id": "mj-visual-v10-ukeire-012", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-012.png"}, {"id": "mj-visual-v10-ukeire-013", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-013.png"}, {"id": "mj-visual-v10-ukeire-014", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-014.png"}, {"id": "mj-visual-v10-ukeire-015", "goal": "max_ukeire_discard", "image": "mj-visual-v10-ukeire-015.png"}, {"id": "mj-visual-v10-wait-001", "goal": "winning_tiles", "image": "mj-visual-v10-wait-001.png"}, {"id": "mj-visual-v10-wait-002", "goal": "winning_tiles", "image": "mj-visual-v10-wait-002.png"}, {"id": "mj-visual-v10-wait-003", "goal": "winning_tiles", "image": "mj-visual-v10-wait-003.png"}, {"id": "mj-visual-v10-wait-004", "goal": "winning_tiles", "image": "mj-visual-v10-wait-004.png"}, {"id": "mj-visual-v10-wait-005", "goal": "winning_tiles", "image": "mj-visual-v10-wait-005.png"}, {"id": "mj-visual-v10-wait-006", "goal": "winning_tiles", "image": "mj-visual-v10-wait-006.png"}, {"id": "mj-visual-v10-wait-007", "goal": "winning_tiles", "image": "mj-visual-v10-wait-007.png"}, {"id": "mj-visual-v10-wait-008", "goal": "winning_tiles", "image": "mj-visual-v10-wait-008.png"}, {"id": "mj-visual-v10-wait-009", "goal": "winning_tiles", "image": "mj-visual-v10-wait-009.png"}, {"id": "mj-visual-v10-wait-010", "goal": "winning_tiles", "image": "mj-visual-v10-wait-010.png"}, {"id": "mj-visual-v10-wait-011", "goal": "winning_tiles", "image": "mj-visual-v10-wait-011.png"}, {"id": "mj-visual-v10-wait-012", "goal": "winning_tiles", "image": "mj-visual-v10-wait-012.png"}, {"id": "mj-visual-v10-wait-013", "goal": "winning_tiles", "image": "mj-visual-v10-wait-013.png"}, {"id": "mj-visual-v10-wait-014", "goal": "winning_tiles", "image": "mj-visual-v10-wait-014.png"}, {"id": "mj-visual-v10-wait-015", "goal": "winning_tiles", "image": "mj-visual-v10-wait-015.png"}, {"id": "mj-visual-v20-ukeire-001", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-001.png"}, {"id": "mj-visual-v20-ukeire-002", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-002.png"}, {"id": "mj-visual-v20-ukeire-003", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-003.png"}, {"id": "mj-visual-v20-ukeire-004", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-004.png"}, {"id": "mj-visual-v20-ukeire-005", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-005.png"}, {"id": "mj-visual-v20-ukeire-006", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-006.png"}, {"id": "mj-visual-v20-ukeire-007", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-007.png"}, {"id": "mj-visual-v20-ukeire-008", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-008.png"}, {"id": "mj-visual-v20-ukeire-009", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-009.png"}, {"id": "mj-visual-v20-ukeire-010", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-010.png"}, {"id": "mj-visual-v20-ukeire-011", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-011.png"}, {"id": "mj-visual-v20-ukeire-012", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-012.png"}, {"id": "mj-visual-v20-ukeire-013", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-013.png"}, {"id": "mj-visual-v20-ukeire-014", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-014.png"}, {"id": "mj-visual-v20-ukeire-015", "goal": "max_ukeire_discard", "image": "mj-visual-v20-ukeire-015.png"}, {"id": "mj-visual-v20-wait-001", "goal": "winning_tiles", "image": "mj-visual-v20-wait-001.png"}, {"id": "mj-visual-v20-wait-002", "goal": "winning_tiles", "image": "mj-visual-v20-wait-002.png"}, {"id": "mj-visual-v20-wait-003", "goal": "winning_tiles", "image": "mj-visual-v20-wait-003.png"}, {"id": "mj-visual-v20-wait-004", "goal": "winning_tiles", "image": "mj-visual-v20-wait-004.png"}, {"id": "mj-visual-v20-wait-005", "goal": "winning_tiles", "image": "mj-visual-v20-wait-005.png"}, {"id": "mj-visual-v20-wait-006", "goal": "winning_tiles", "image": "mj-visual-v20-wait-006.png"}, {"id": "mj-visual-v20-wait-007", "goal": "winning_tiles", "image": "mj-visual-v20-wait-007.png"}, {"id": "mj-visual-v20-wait-008", "goal": "winning_tiles", "image": "mj-visual-v20-wait-008.png"}, {"id": "mj-visual-v20-wait-009", "goal": "winning_tiles", "image": "mj-visual-v20-wait-009.png"}, {"id": "mj-visual-v20-wait-010", "goal": "winning_tiles", "image": "mj-visual-v20-wait-010.png"}, {"id": "mj-visual-v20-wait-011", "goal": "winning_tiles", "image": "mj-visual-v20-wait-011.png"}, {"id": "mj-visual-v20-wait-012", "goal": "winning_tiles", "image": "mj-visual-v20-wait-012.png"}, {"id": "mj-visual-v20-wait-013", "goal": "winning_tiles", "image": "mj-visual-v20-wait-013.png"}, {"id": "mj-visual-v20-wait-014", "goal": "winning_tiles", "image": "mj-visual-v20-wait-014.png"}, {"id": "mj-visual-v20-wait-015", "goal": "winning_tiles", "image": "mj-visual-v20-wait-015.png"}];
    const task = document.getElementById('task');
    const board = document.getElementById('board');
    const markComplete = document.getElementById('mark-complete');
    const resetProgress = document.getElementById('reset-progress');
    const overallProgress = document.getElementById('overall-progress');
    const taskPosition = document.getElementById('task-position');
    const taskStatus = document.getElementById('task-status');
    const storageKey = 'minibench-mahjong-progress-v1:' + tasks.map((item) => item.id).join(',');
    const goalLabels = {"winning_tiles": "Winning tiles / 听牌进张", "max_ukeire_discard": "Max ukeire discard / 最佳切牌"};
    const completed = new Set(loadCompleted());

    function loadCompleted() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(stored) ? stored.filter((id) => tasks.some((item) => item.id === id)) : [];
      } catch (error) {
        return [];
      }
    }

    function saveCompleted() {
      try { localStorage.setItem(storageKey, JSON.stringify([...completed])); }
      catch (error) { /* Private browsing may disable localStorage. */ }
    }

    function selectedTask() {
      return tasks.find((item) => item.image === task.value) || null;
    }

    function updateProgress() {
      overallProgress.textContent = `${completed.size}/${tasks.length}`;
      for (const card of document.querySelectorAll('[data-goal]')) {
        const goal = card.dataset.goal;
        const total = tasks.filter((item) => item.goal === goal).length;
        const count = tasks.filter((item) => item.goal === goal && completed.has(item.id)).length;
        const fill = card.querySelector('[data-progress-fill]');
        const countLabel = card.querySelector('[data-progress-count]');
        const progress = card.querySelector('[role="progressbar"]');
        countLabel.textContent = `${count}/${total}`;
        fill.style.width = total ? `${count / total * 100}%` : '0%';
        progress.setAttribute('aria-valuenow', count);
      }
      for (const option of task.options) {
        const item = tasks.find((candidate) => candidate.image === option.value);
        if (item) option.textContent = `${completed.has(item.id) ? '✓ ' : ''}${item.id} - ${item.goal}`;
      }
    }

    function renderTask() {
      const item = selectedTask();
      if (!item) {
        board.removeAttribute('src');
        taskPosition.textContent = '';
        taskStatus.textContent = '';
        markComplete.disabled = true;
        return;
      }
      board.src = item.image;
      const sameGoal = tasks.filter((candidate) => candidate.goal === item.goal);
      const position = sameGoal.findIndex((candidate) => candidate.id === item.id) + 1;
      taskPosition.textContent = `${goalLabels[item.goal] || item.goal} · ${position}/${sameGoal.length}`;
      const isComplete = completed.has(item.id);
      taskStatus.textContent = isComplete ? '✓ 已完成' : '尚未完成';
      markComplete.textContent = isComplete ? '取消完成' : '完成本题';
      markComplete.setAttribute('aria-pressed', String(isComplete));
      markComplete.disabled = false;
    }

    task.addEventListener('change', renderTask);
    markComplete.addEventListener('click', () => {
      const item = selectedTask();
      if (!item) return;
      if (completed.has(item.id)) completed.delete(item.id);
      else completed.add(item.id);
      saveCompleted();
      updateProgress();
      renderTask();
    });
    resetProgress.addEventListener('click', () => {
      completed.clear();
      saveCompleted();
      updateProgress();
      renderTask();
    });

    updateProgress();
    renderTask();
  </script>

</html>
