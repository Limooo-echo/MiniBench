task:
  family: mahjong_solo
  path: data/mahjong_solo/diagnostic_terminal_win.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible

provider:
  name: deepseek
  model: deepseek-v4-flash
  temperature: 0.0
  json_mode: true
  max_tokens: 512
  timeout: 180
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  extra_body:
    thinking:
      type: disabled

evaluation:
  observation_mode: full-hand
  show_progress: true

run:
  output_dir: runs/diagnostics
  run_name: mahjong-terminal-direct-phasefix
