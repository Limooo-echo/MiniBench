# Fixed small pilot. No API call occurs until "run".
version: 1
workers: 8
pilot_count: 6
omit_max_tokens: true
# Bind and record the Linux binary/NNUE actually provided via PIKAFISH_PATH.
# This is an explicit engine condition, not identity with archived Windows runs.
engine_binding: runtime
agents: [direct]
accounts:
  qwen:
    provider:
      name: generic
      model: qwen
      base_url: https://models.sjtu.edu.cn/api/v1
      api_key_env: MINIBENCH_SJTU_API_KEY
      timeout: 3600
      json_mode: false
      max_retries: 0
      extra_body:
        enable_thinking: true
        chat_template_kwargs:
          enable_thinking: true
    limits:
      max_in_flight: 8
      # Replace null with limits confirmed for YOUR endpoint/account.
      requests_per_minute: null
      tokens_per_minute: null
      reserve_tokens: 32768
      total_token_budget: null
experiments:
  - id: d3
    config: config/experiments/xiangqi_mate_in_one.yaml
    account: qwen
  - id: h2
    config: config/experiments/xiangqi_history.yaml
    account: qwen
  - id: c2
    config: config/experiments/xiangqi_rule_variants.yaml
    account: qwen
  - id: m2
    config: config/experiments/xiangqi_multimodal.yaml
    account: qwen
    evaluation_overrides:
      input_modes: [chinese-piece-image]
