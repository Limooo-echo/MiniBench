task:
  family: one_stroke
  path: data/one_stroke/a4_multimodal.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible
  samples: 1
  reasoning_temperature: 0.0
  final_temperature: 0.0
  max_reasoning_tokens: 1024

provider:
  name: qwen
  model: qwen3.8-max
  json_mode: true
  max_tokens: 1024
  timeout: 120

evaluation:
  input_modes:
    - text
    - clear_image
    - challenge_image
  show_progress: true

run:
  output_dir: runs
  run_name: null
