task:
  family: one_stroke
  path: data/one_stroke/a4_multimodal.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible

provider:
  name: qwen
  model: qwen3.8-max
  json_mode: true
  max_tokens: 1024
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  timeout: 120
  extra_body:
    enable_thinking: false

evaluation:
  input_modes:
    - text
    - clear_image
    - challenge_image
  show_progress: true

run:
  output_dir: runs
  run_name: null
