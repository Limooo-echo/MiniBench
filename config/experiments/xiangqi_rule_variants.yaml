task:
  prompt_version: xiangqi-shortest-tree-strict-n-v2
  family: xiangqi-rule-variants
  path: data/xiangqi/rule_variants/tasks.jsonl
  limit: 200
agent:
  name: direct
  max_format_repairs: 0
provider:
  name: qwen
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  omit_max_tokens: true
  timeout: 900
  max_retries: 0
  json_mode: false
  extra_body:
    stream: true
    enable_thinking: true
evaluation:
  final_move_timeout_seconds: 900
  search_depth: 3
  horizon_policy: certified_shortest_attacker_moves
  pricing: null
  solution_tree_dir: data/xiangqi/solution_trees/c2
run:
  output_dir: runs
  run_name: xiangqi_c2_direct_submitted200_r1
  on_existing: error
