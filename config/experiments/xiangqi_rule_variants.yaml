task:
  prompt_version: xiangqi-v4-free-uci-single-move-paired-rules
  family: xiangqi-rule-variants
  path: data/xiangqi/rule_variants/tasks.jsonl
  sampling:
    enabled: true
    seed: 42
    count: 10
    # Sample 10 scenarios across the three rule foci, then keep all four
    # same-FEN rule conditions for every selected scenario.
    strategy: paired-stratified

agent:
  name: direct
  max_tokens: 512

provider:
  name: qwen
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  max_retries: 3
  json_mode: true
  extra_body:
    enable_thinking: false

evaluation:
  oracle_depth: 3
  max_plies: 1

run:
  output_dir: runs
  run_name: xiangqi_c2_direct_qwen38max_free_uci_v3
