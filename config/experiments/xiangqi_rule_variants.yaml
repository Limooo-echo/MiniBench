task:
  prompt_version: xiangqi-reasoning-v2
  family: xiangqi-rule-variants
  path: data/xiangqi/rule_variants/tasks.jsonl
  limit: 100
agent:
  name: direct
  max_tokens: 512
provider:
  name: qwen
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  max_retries: 3
  json_mode: true
  extra_body:
    enable_thinking: false
evaluation:
  search_depth: 3
  horizon_policy: reference_mate_plies_plus_4
  loss_unit: rule-aware-centipawn-equivalent-not-pikafish
run:
  output_dir: runs
  run_name: xiangqi_c2_direct_submitted100_r1
  on_existing: error
