task:
  family: xiangqi-multimodal
  path: data/xiangqi/multimodal/tasks.jsonl
  sampling:
    enabled: false
    seed: 42
    count: 10
    strategy: random

agent:
  name: openai-compatible
  max_tokens: 512

provider:
  name: qwen
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  json_mode: true
  timeout: 120
  extra_body:
    enable_thinking: false

evaluation:
  input_modes:
    - text
    - chinese-piece-image
    - latin-piece-image
  opponent_depth: 4
  optimal_depth: 3
  max_plies: 20

run:
  output_dir: runs
  run_name: null
