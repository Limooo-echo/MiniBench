task:
  family: xiangqi-mate-in-one
  path: data/xiangqi/mate_in_one/tasks.jsonl
  sampling:
    enabled: false
    seed: 42
    count: 10
    strategy: stratified

agent:
  name: openai-compatible
  max_tokens: 512

provider:
  name: deepseek
  model: deepseek-v4-flash
  api_key_env: DEEPSEEK_API_KEY

evaluation:
  pikafish_depth: 8
  pikafish_timeout: 60.0
  max_plies: 4

run:
  output_dir: runs
  run_name: null
