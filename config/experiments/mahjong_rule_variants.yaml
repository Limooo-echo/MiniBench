task:
  family: mahjong_rule_variants
  path: data/mahjong_solo/tasks_win.jsonl
  limit: null
  task_ids: []

agent:
  name: cot
  samples: 1
  reasoning_temperature: 0.0
  final_temperature: 0.0
  max_reasoning_tokens: 2048

provider:
  name: deepseek
  model: deepseek-v4-flash
  json_mode: true
  max_tokens: 512
  timeout: 120
  extra_body:
    thinking:
      type: disabled

evaluation:
  observation_mode: full-hand
  show_progress: true
  rule_channels:
    - "red_dragon_wildcard+cyclic_one_tile_substitution"
run:
  output_dir: runs
  run_name: new-rule4
