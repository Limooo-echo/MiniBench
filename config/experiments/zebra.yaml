task:
  family: zebra
  path: data/zebra/tasks.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible

provider:
  name: deepseek
  temperature: 0.0
  max_tokens: 4096
  timeout: 120
  json_mode: true

evaluation:
  memory_modes:
    - incremental_state
    - deferred_reasoning
  state_max_tokens: 512
  ack_max_tokens: 32
  final_max_tokens: 4096
  show_progress: true

run:
  output_dir: runs
  run_name: null
