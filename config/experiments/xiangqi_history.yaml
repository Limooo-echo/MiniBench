task:
  prompt_version: xiangqi-v3-paired-free-uci-history
  family: xiangqi-history
  path: data/xiangqi/history/tasks.jsonl
  sampling:
    enabled: true
    seed: 42
    count: 30
    # 10 tasks each from mate-in-2/3, mate-in-4/5, and mate-in-6+.
    strategy: stratified

agent:
  name: direct
  max_tokens: 512

provider:
  name: qwen
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  max_retries: 3
  json_mode: true
  extra_body:
    enable_thinking: false

evaluation:
  history_mode: paired
  # Formal H2 runs use the corpus verification depth.  The sampled smoke
  # runner intentionally overrides this to its explicit --pikafish-depth.
  pikafish_depth: 16
  pikafish_timeout: 60.0

run:
  output_dir: runs
  run_name: xiangqi_h2_direct_qwen38max_paired_free_uci_v3
