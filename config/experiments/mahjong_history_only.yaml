task:
  family: mahjong_rule_variants
  path: data/mahjong_solo/tasks_win.jsonl
  limit: null
  task_ids: []

agent:
  name: cot
  samples: 1
  reasoning_temperature: 0.0
  final_temperature: 0.0
  max_reasoning_tokens: 1024

provider:
  name: deepseek
  model: deepseek-v4-flash
  json_mode: true
  max_tokens: 512
  timeout: 120
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  extra_body:
    thinking:
      type: disabled

evaluation:
  rule_channel: standard
  observation_mode: history-only
  show_progress: true

run:
  output_dir: runs
  run_name: mahjong-history-only-cot-current-turn-v2
