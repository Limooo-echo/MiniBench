task:
  family: one_stroke
  path: data/one_stroke/tasks_generated.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible

provider:
  name: deepseek
  model: deepseek-v4-flash
  json_mode: true
  max_tokens: 512
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  timeout: 120
  extra_body:
    thinking:
      type: disabled

evaluation:
  prompt_variant: baseline
  show_progress: true

run:
  output_dir: runs
  run_name: null
