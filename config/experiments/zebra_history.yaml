task:
  family: zebra
  path: data/zebra/history_eval.jsonl
  limit: null
  task_ids: []

agent:
  name: passthrough

provider:
  name: deepseek
  temperature: 0.0
  max_tokens: 4096
  timeout: 120
  json_mode: true
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0

evaluation:
  memory_modes:
    - deferred_reasoning

  state_max_tokens: 512
  ack_max_tokens: 32
  final_max_tokens: 4096
  show_progress: true

run:
  output_dir: runs
  run_name: zebra-history-deferred_0823
  on_existing: resume
