# Compatibility alias for the canonical A1 config: one_stroke_a1.yaml.
task:
  family: one_stroke
  path: data/one_stroke/a1_direct.jsonl
  limit: null
  task_ids: []

agent:
  name: passthrough

provider:
  name: deepseek
  model: deepseek-v4-flash
  json_mode: true
  max_tokens: 1024
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  timeout: 120
  extra_body:
    thinking:
      type: disabled

evaluation:
  # MiniBench 2.0 A1 deliberately provides no Euler-theorem hint.
  prompt_variant: baseline
  show_progress: true

run:
  output_dir: runs
  run_name: null
