task:
  family: one_stroke
  path: data/one_stroke/a3_history.jsonl
  limit: null
  task_ids: []

agent:
  name: passthrough

provider:
  name: deepseek
  model: deepseek-v4-flash
  json_mode: true
  max_tokens: 1024
  max_retries: 3
  retry_initial_backoff_seconds: 1.0
  retry_max_backoff_seconds: 30.0
  timeout: 120
  extra_body:
    thinking:
      type: disabled

evaluation:
  memory_modes:
    - incremental_state
    - step_history_only
  state_max_tokens: 512
  ack_max_tokens: 32
  final_max_tokens: 1024
  show_progress: true

run:
  output_dir: runs
  run_name: one_stroke_history_0825
