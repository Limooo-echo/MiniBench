task:
  family: mahjong
  path: data/mahjong/visual_tasks.jsonl
  limit: null
  task_ids: []

agent:
  name: cot
  samples: 1
  reasoning_temperature: 0.0
  final_temperature: 0.0
  max_reasoning_tokens: 512

provider:
  name: qwen
  model: qwen3.8-max
  json_mode: true
  max_tokens: 1024
  timeout: 300
  extra_body:
    thinking:
      type: disabled

evaluation:
  input_modes:
    - image

run:
  output_dir: runs
  run_name: mahjong_multimodal_image_cot
