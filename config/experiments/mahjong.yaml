task:
  family: mahjong
  path: data/mahjong/tasks.jsonl
  limit: null
  task_ids: []

agent:
  name: cot
  prompt_version: v1
  max_format_repairs: 0
  reasoning_temperature: 0.0
  final_temperature: 0.0
  max_reasoning_tokens: 1024

provider:
  name: qwen
  model: qwen3.8-max
  json_mode: true
  max_tokens: 1024
  timeout: 300
  extra_body:
    enable_thinking: false

run:
  output_dir: runs
  run_name: mahjong-cot-new-qwen-100-per-type
