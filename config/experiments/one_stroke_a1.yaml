task:
  family: one_stroke
  path: data/one_stroke/a1_direct.jsonl
  limit: null
  task_ids: []

agent:
  name: openai-compatible
  samples: 3
  reasoning_temperature: 0.7
  final_temperature: 0.0
  max_reasoning_tokens: 1024

provider:
  name: deepseek
  model: deepseek-chat
  json_mode: true
  max_tokens: 1024
  timeout: 120

evaluation:
  # MiniBench 2.0 A1 deliberately provides no Euler-theorem hint.
  prompt_variant: baseline
  show_progress: true

run:
  output_dir: runs
  run_name: null
